customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "Rime::SwitcherSettings"
  modified_time: "Fri Jul 24 22:47:15 2026"
  rime_version: 1.13.1

patch:
  # ── 方案列表 ──
  # 仅启用雾凇拼音，按需在此添加其他方案
  schema_list:
    - {schema: rime_ice}

  # ── 方案选单 ──
  # 方案选单默认展开所有方案，设为 false 可折叠
  switcher/fold_options: false
  ascii_composer/switch_key/Shift_R: commit_code

  # ── 输入栏光标 ──
  # default.yaml 的 navigator 把 ←/→ 绑成了逐字符移动（left_by_char_no_loop），
  # 这里只把 ← 改成按音节跳转：输入 nihao 后按一次 ← 停在 ni|hao；→ 仍逐字符。
  navigator/bindings/Left: left_by_syllable_no_loop
