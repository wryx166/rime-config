patch:
  # ── 词典 ──
  # 使用自定义词典 rime_ice.custom.dict.yaml
  translator/dictionary: rime_ice.custom

  translator/dictionary_exclude: [哥伦比亚]

  # librime 1.13.1 不支持 dictionary_exclude（需 >= 1.14），
  # 改用自定义 lua 过滤器屏蔽候选词（黑名单见 lua/blacklist.lua）
  engine/filters/+: [lua_filter@*blacklist]

  # ── 冷词丢弃（lua/cold_word_drop/）──
  # Ctrl+D 删词  / Ctrl+X 按编码隐藏  / Ctrl+J 降频，词表写回 lua/cold_word_drop/*.lua
  # processor 与 filter 必须一起挂：filter 依赖 processor 加载的 table.find_index 等辅助函数
  engine/processors/+: [lua_processor@*cold_word_drop.processor]
  engine/filters/+: [lua_filter@*cold_word_drop.filter]

  # ── 语法模型（万象，简体）──
  # 模型文件：wanxiang-lts-zh-hans.gram，放在小狼毫用户目录下
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 6
    collocation_min_length: 3
    collocation_penalty: -14
    non_collocation_penalty: -6
    weak_collocation_penalty: -100
    rear_penalty: -20
  translator/contextual_suggestions: false
  translator/max_homophones: 8
  speller/algebra/+:
    ### 模糊音
    # 声母
    - derive/^([zcs])h/$1/          # zh* ch* sh* 派生出 z* c* s*
    - derive/^([zcs])([^h])/$1h$2/  # z* c* s*    派生出 zh* ch* sh*
    - derive/^l/n/  # 解释：为 l 开头的拼写派生出 n 开头，即 nai 也可以输出 lai（来、莱、赖……）
    - derive/^n/l/  #      lai 可输出 nai（奶、乃、奈……）。 可以单向或成对儿启用模糊音
    # - derive/^f/h/
    # - derive/^h/f/
    # - derive/^l/r/
    # - derive/^r/l/
    # - derive/^g/k/
    # - derive/^k/g/
    # 韵母
    - derive/ang$/an/
    # - derive/an$/ang/
    - derive/eng$/en/
    # - derive/en$/eng/
    # - derive/in$/ing/
    # - derive/ing$/in/
    # - derive/ian$/iang/
    # - derive/iang$/ian/
    # - derive/uan$/uang/
    # - derive/uang$/uan/
    # - derive/ai$/an/
    # - derive/an$/ai/
    # - derive/ong$/un/
    # - derive/un$/ong/
    # - derive/ong$/on/
    # - derive/iong$/un/
    # - derive/un$/iong/
    # - derive/ong$/eng/
    # - derive/eng$/ong/
    # 拼音音节
    # - derive/^fei$/hui/
    # - derive/^hui$/fei/
    # - derive/^hu$/fu/
    # - derive/^fu$/hu/
    # - derive/^wang$/huang/
    # - derive/^huang$/wang/

    ### 旧时的拼写规则
    # - derive/un$/uen/
    # - derive/ui$/uei/
    # - derive/iu$/iou/
