customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "Weasel::UIStyleSettings"
  modified_time: "Fri Jul 24 22:03:02 2026"
  rime_version: 1.13.1
patch:
  # 应用兼容：浏览器行内预编辑
  "app_options/firefox.exe/inline_preedit": true
  "app_options/iexplore.exe/inline_preedit": true
  "app_options/browser.exe/inline_preedit": true

  # 全局行为
  "show_notifications": true
  "show_notifications_time": 1200
  "global_ascii": false

  "style/color_scheme": mint_light_green
  "style/color_scheme_dark": mint_dark_green
  "style/inline_preedit": false
  "style/preedit_type": composition
  "style/font_face": "Microsoft YaHei"
  "style/label_font_face": "Microsoft YaHei"
  "style/comment_font_face": "Microsoft YaHei"
  "style/font_point": 12
  "style/label_font_point": 12
  "style/comment_font_point": 10
  "style/horizontal": true
  "style/candidate_list_layout": linear
  "style/label_format": "%s"
  "style/mark_text": "|"
  "style/enhanced_position": true
  "style/display_tray_icon": false
  "style/antialias_mode": default
  "style/candidate_abbreviate_length": 30
  "style/hover_type": none
  "style/paging_on_scroll": true

  "style/layout/min_width": 145
  "style/layout/border_width": 0
  "style/layout/margin_x": 8
  "style/layout/margin_y": 8
  "style/layout/spacing": 10
  "style/layout/candidate_spacing": 22
  "style/layout/hilite_spacing": 6
  "style/layout/hilite_padding": 8
  "style/layout/shadow_radius": 0
  "style/layout/shadow_offset_x": 4
  "style/layout/shadow_offset_y": 4
  "style/layout/corner_radius": 8
  "style/layout/round_corner": 8

